<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MEA Review</title>
  <link rel="stylesheet" href="/risk-review.css">
  <script src="/risk-review.js" type="module"></script>
</head>
<body>
  <a class="skip" id="skip" href="#review-title" data-i18n>Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="mobile-switch" id="inbox-toggle" type="button" aria-controls="queue" aria-expanded="false" hidden></button>
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">‹›</span>MEA Review</a>
      <span class="workspace-name" data-i18n>Code review</span>
      <div class="topbar-tools">
        <button type="button" id="language-toggle" class="language-toggle">English</button>
        <span class="demo-badge" id="demo-badge" hidden data-i18n>Demo data</span>
      </div>
    </div>
  </header>
  <div class="workspace" id="risk-workspace">
    <aside class="queue" id="queue" aria-labelledby="inbox-title">
      <div class="queue-heading">
        <h2 id="inbox-title" tabindex="-1" data-i18n>PR Inbox</h2>
        <a class="text-link" href="/classic"><span aria-hidden="true">+ </span><span data-i18n>Import snapshot</span></a>
      </div>
      <div id="queue-filters" class="filters"></div>
      <ul id="queue-items" class="queue-items"></ul>
      <div id="queue-message" role="status"></div>
    </aside>
    <main class="review" id="risk-review" aria-labelledby="review-title" aria-busy="true">
      <div class="review-content" id="review-content">
        <h1 id="review-title" tabindex="-1" data-i18n>Loading pull requests…</h1>
      </div>
      <footer id="review-actions" class="actions" hidden></footer>
    </main>
  </div>
  <dialog id="risk-dialog" aria-labelledby="dialog-title">
    <div class="dialog-head">
      <h2 id="dialog-title" tabindex="-1"></h2>
      <form method="dialog"><button class="secondary" data-i18n>Close</button></form>
    </div>
    <div id="dialog-body" class="dialog-body"></div>
  </dialog>
  <p id="toast" class="toast" role="status" hidden></p>
</body>
</html>
